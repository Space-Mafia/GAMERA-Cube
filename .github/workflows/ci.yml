name: Build and smoke
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential openmpi-bin libopenmpi-dev libhdf5-openmpi-dev python3-numpy python3-h5py python3-matplotlib
      - name: Configure and build production driver
        run: |
          cmake -S cubedsphere -B build -DCMAKE_C_COMPILER=mpicc -DCMAKE_BUILD_TYPE=Release -DGAMERA_REQUIRE_PRODUCTION=ON -DPython3_EXECUTABLE=/usr/bin/python3 '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -fno-fast-math'
          cmake --build build -j 2
      - name: Numerical tests and launcher tests
        run: |
          ctest --test-dir build --output-on-failure --timeout 600 -j 2 -E 'mpi|tiled|mi_shell|halo_block|halo_parallel|mi_earth'
          python3 scripts/test_launcher.py
      - name: MPI and parallel-HDF5 smoke
        run: |
          python3 scripts/run_earth.py --profile smoke --output runs/ci-smoke
          /usr/bin/python3 scripts/plot_earth.py runs/ci-smoke --output runs/ci-smoke/preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-diagnostics
          path: |
            build/Testing/Temporary/*.log
            runs/ci-smoke/*.log
            runs/ci-smoke/config_receipt.json
            runs/ci-smoke/*.png
